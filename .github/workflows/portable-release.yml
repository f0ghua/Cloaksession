name: portable-release

# Fork-only portable releases. Tags are F-v<upstream-base>.<fork-rev>, e.g.
# F-v1.5.2.1 = first fork release based on upstream 1.5.2. The F- prefix
# never collides with upstream v* tags and never triggers release.yml.
on:
  push:
    tags: ['F-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. F-v1.5.2.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: portable-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            desktop/resources/playwright/package-lock.json
            desktop/resources/reverse/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: desktop/go.sum

      - name: Resolve tag and verify it matches the in-repo base version
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          BASE="$(python -c "import json; print(json.load(open('desktop/wails.json'))['info']['productVersion'])")"
          if [[ ! "$TAG" =~ ^F-v([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must be F-v<major.minor.patch>.<fork-rev>, got: $TAG" >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$BASE" ]]; then
            echo "Tag base ${BASH_REMATCH[1]} does not match wails.json productVersion $BASE" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Test Go backend (mirrors the upstream Windows build job)
        working-directory: desktop
        run: go test -count=1 -mod=readonly ./...

      # Builds Cloaksession.exe and stages playwright/reverse/companion into
      # desktop/build/bin/resources/ (stage_runtime). No installer, no NSIS.
      - name: Build portable tree
        run: python scripts/build.py

      - name: Zip portable distribution
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $asset = "desktop/build/dist/Cloaksession-$tag-windows-amd64-portable.zip"
          New-Item -ItemType Directory -Force -Path "desktop/build/dist" | Out-Null
          7z a -tzip "$asset" "desktop/build/bin/Cloaksession.exe" "desktop/build/bin/resources"
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          Get-Item $asset | Select-Object FullName, Length
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: zip

      - name: Verify portable zip contains key runtime resources
        shell: pwsh
        run: |
          $asset = "${{ steps.zip.outputs.asset }}"
          $text = (& 7z l -slt $asset) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'zip listing failed' }
          foreach ($path in @(
              'Cloaksession.exe',
              'resources\playwright\bridge.mjs',
              'resources\reverse\bridge.mjs',
              'resources\reverse\node_modules\js-reverse-mcp\package.json',
              'resources\companion\manifest.json')) {
            if (-not $text.Contains($path)) { throw "portable zip missing $path" }
          }

      - name: Create GitHub release with the portable asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          BASE: ${{ steps.tag.outputs.base }}
          SHA: ${{ github.sha }}
          ASSET: ${{ steps.zip.outputs.asset }}
        shell: bash
        run: |
          gh release create "$TAG" "$ASSET" \
            --verify-tag \
            --title "Portable $TAG (based on upstream $BASE)" \
            --notes "Fork portable build of Cloaksession.

          - Base version: **$BASE** (upstream)
          - Fork release: \`$TAG\`
          - Commit: \`${SHA:0:10}\`
          - Contents: \`Cloaksession.exe\` + \`resources/\` (playwright, reverse debugging, companion)

          Usage: unzip anywhere and run \`Cloaksession.exe\`. Windows only (amd64).
          The embedded WebView2 bootstrapper prompts if the Runtime is missing.
          Chromix engine and reverse debugging additionally need Node.js 20+ on the
          target machine. Data is stored per-machine in
          \`%LOCALAPPDATA%\\com.cloaksession.browser\` unless \`CLOAKSESSION_DATA_DIR\`
          is set. Login state is never bundled - use .mzar export/import to move it."
